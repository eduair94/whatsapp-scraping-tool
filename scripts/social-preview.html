<!doctype html>
<!--
  The repository's social preview (GitHub → Settings → Social preview), 1280 × 640.
  Open this file through a local web server from the repository root and take a
  screenshot of the page at 1280 × 640; the result is docs/social-preview.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Number Checker</title>
    <style>
      @font-face {
        font-family: 'Figtree Variable';
        font-weight: 300 900;
        src: url('../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2') format('woff2-variations');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #eef5f1;
        color: #16233b;
        font: 400 24px/1.4 'Figtree Variable', sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .words {
        position: absolute;
        top: 84px;
        left: 80px;
        width: 500px;
      }
      .icon {
        display: block;
        width: 88px;
        height: 88px;
        margin-bottom: 36px;
      }
      h1 {
        font-size: 60px;
        line-height: 66px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 22px;
        color: #536070;
        font-size: 28px;
        line-height: 38px;
      }
      ul {
        display: flex;
        gap: 24px;
        margin-top: 44px;
        white-space: nowrap;
        padding: 0;
        list-style: none;
        font-size: 20px;
        font-weight: 600;
      }
      li {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .shot {
        position: absolute;
        top: 72px;
        left: 640px;
        width: 1040px;
        border: 1px solid #d5e0da;
        border-radius: 12px;
        box-shadow: 0 30px 60px -24px rgb(22 35 59 / 0.35);
      }
    </style>
  </head>
  <body>
    <div class="words">
      <img class="icon" src="../build/icon.png" alt="" />
      <h1>WhatsApp Number Checker</h1>
      <p>Check a whole list of numbers. See every profile, picture and business.</p>
      <ul>
        <li>
          <svg viewBox="0 0 16 16" stroke="#1f8a5b"><path d="M3.2 8.6l3.1 3.1 6.5-7.4" /></svg>
          Free
        </li>
        <li>
          <svg viewBox="0 0 16 16" stroke="#1f8a5b"><path d="M3.2 8.6l3.1 3.1 6.5-7.4" /></svg>
          Open source
        </li>
        <li>
          <svg viewBox="0 0 16 16" stroke="#1f8a5b"><path d="M3.2 8.6l3.1 3.1 6.5-7.4" /></svg>
          Windows, macOS, Linux
        </li>
      </ul>
    </div>
    <img class="shot" src="../docs/images/05-details.png" alt="" />
  </body>
</html>
